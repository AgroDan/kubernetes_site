apiVersion: apps/v1
kind: Deployment
metadata:
  name: uaclookup-deployment
  labels:
    app: uaclookup-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uaclookup-site
  template:
    metadata:
      labels:
        app: uaclookup-site
    spec:
      # Spread replicas across nodes so one node failure doesn't take the site down.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: uaclookup-site
      containers:
      - name: uaclookup-site
        image: agr0dan/uac_lookup:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        ports:
        - containerPort: 8000
