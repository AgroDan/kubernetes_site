apiVersion: apps/v1
kind: Deployment
metadata:
  name: halford-deployment
  labels:
    app: halford-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: halford-site
  template:
    metadata:
      labels:
        app: halford-site
    spec:
      containers:
      - name: halford-site
        image: agr0dan/halford.einados.com:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        ports:
        - containerPort: 80
