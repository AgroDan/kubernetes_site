apiVersion: apps/v1
kind: Deployment
metadata:
  name: halford-deployment
  labels:
    app: halford-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: halford-site
  template:
    metadata:
      labels:
        app: halford-site
    spec:
      # Spread replicas across nodes so one node failure doesn't take the site down.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: halford-site
      containers:
      - name: halford-site
        image: agr0dan/halford.einados.com:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        ports:
        - containerPort: 80
