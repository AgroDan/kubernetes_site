apiVersion: apps/v1
kind: Deployment
metadata:
  name: hhc2022-deployment
  labels:
    app: hhc2022-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hhc2022-site
  template:
    metadata:
      labels:
        app: hhc2022-site
    spec:
      # Spread replicas across nodes so one node failure doesn't take the site down.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: hhc2022-site
      containers:
      - name: hhc2022-site
        image: agr0dan/hhc2022:20250314
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        ports:
        - containerPort: 80
