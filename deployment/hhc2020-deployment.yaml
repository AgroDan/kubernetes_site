apiVersion: apps/v1
kind: Deployment
metadata:
  name: hhc2020-deployment
  labels:
    app: hhc2020-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hhc2020-site
  template:
    metadata:
      labels:
        app: hhc2020-site
    spec:
      containers:
      - name: hhc2020-site
        image: agr0dan/hhc2020:20250314
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        ports:
        - containerPort: 80
